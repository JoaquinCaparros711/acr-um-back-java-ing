# =============================================================================
# Application
# =============================================================================
spring.application.name=dental-management-backend
spring.profiles.active=dev

# =============================================================================
# DataSource & JPA / Hibernate (H2 In-Memory Database)
# =============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:dentaldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =============================================================================
# Spring Actuator — expose health & metrics endpoints
# =============================================================================
management.endpoints.web.exposure.include=health,metrics,info,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# =============================================================================
# OpenTelemetry — Auto-configured via environment variables at runtime.
# Set OTEL_EXPORTER_OTLP_ENDPOINT and OTEL_SERVICE_NAME in production.
# Defaults: stdout exporter enabled when no OTLP endpoint is configured.
# =============================================================================
otel.service.name=${OTEL_SERVICE_NAME:dental-management-backend}
otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:}
otel.exporter.otlp.protocol=${OTEL_EXPORTER_OTLP_PROTOCOL:http/protobuf}
otel.logs.exporter=${OTEL_LOGS_EXPORTER:otlp}
otel.metrics.exporter=${OTEL_METRICS_EXPORTER:otlp}
otel.traces.exporter=${OTEL_TRACES_EXPORTER:otlp}

# =============================================================================
# Security / JWT
# =============================================================================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
