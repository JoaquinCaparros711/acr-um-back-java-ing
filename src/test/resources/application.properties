# Test application configuration for test isolation and CI/CD
spring.application.name=dental-management-backend-test

# In-memory H2 Database with MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:dental_management;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT Configuration for testing (at least 256 bits base64 encoded)
jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtYXV0aGVudGljYXRpb24tZGVudGFsLW1hbmFnZW1lbnQ=
jwt.expiration-ms=86400000

# OpenTelemetry disabled in tests
otel.exporter.otlp.endpoint=
